<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colour Match Game</title>
  <link href="./output.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 via-slate-100 to-cyan-100 p-4 font-sans text-slate-800 antialiased">

  <main id="game" class="w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-300/60 p-6 sm:p-10">
    <header class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Colour Match</h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">Pick the colour that matches the target.</p>
    </header>

    <div class="flex items-center justify-between text-sm sm:text-base font-semibold text-slate-600">
      <span id="round-text">Round 1 of 10</span>
      <span id="score-text">Score 0</span>
    </div>

    <div class="mt-2 h-2 w-full bg-slate-100 rounded-full overflow-hidden" role="progressbar" aria-label="Round progress">
      <div id="progress-bar" class="h-full bg-indigo-500 rounded-full transition-all duration-300" style="width: 10%"></div>
    </div>

    <div class="mt-8">
      <p class="text-center text-xs uppercase tracking-widest text-slate-400 font-semibold mb-3">Match this colour</p>
      <div id="target" class="h-28 sm:h-36 w-full rounded-2xl border border-slate-900/10 shadow-inner transition-colors duration-300" aria-label="Target colour"></div>
    </div>

    <p id="feedback-text" class="mt-5 min-h-6 text-center text-sm sm:text-base font-semibold" aria-live="polite"></p>

    <div id="options" class="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4"></div>
  </main>

  <section id="result" class="hidden w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-300/60 p-6 sm:p-10 text-center">
    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900">Round Complete!</h2>
    <p class="mt-6 text-sm uppercase tracking-widest text-slate-400 font-semibold">Final Score</p>
    <p id="final-score" class="mt-2 text-5xl sm:text-6xl font-extrabold text-indigo-600">0 / 10</p>
    <p id="final-message" class="mt-4 text-slate-500 text-base sm:text-lg"></p>
    <button id="play-again" type="button" class="mt-8 inline-block rounded-2xl bg-indigo-600 px-8 py-3 text-base font-bold text-white shadow-md hover:bg-indigo-500 hover:shadow-lg active:scale-95 transition-all duration-150 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300">
      Play Again
    </button>
  </section>

  <script>
    (function () {
      'use strict';

      var TOTAL_ROUNDS = 10;
      var BASE_HUES = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];

      var state = {
        round: 1,
        score: 0,
        locked: false,
        answerIndex: -1
      };

      var els = {
        game: document.getElementById('game'),
        result: document.getElementById('result'),
        target: document.getElementById('target'),
        options: document.getElementById('options'),
        feedback: document.getElementById('feedback-text'),
        roundText: document.getElementById('round-text'),
        scoreText: document.getElementById('score-text'),
        progressBar: document.getElementById('progress-bar'),
        finalScore: document.getElementById('final-score'),
        finalMessage: document.getElementById('final-message'),
        playAgain: document.getElementById('play-again')
      };

      function shuffle(items) {
        var copy = items.slice();
        for (var i = copy.length - 1; i > 0; i -= 1) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        return copy;
      }

      function hslCss(hue, saturation, lightness) {
        return 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)';
      }

      function generateRound() {
        var hues = shuffle(BASE_HUES).slice(0, 4);
        var saturation = 58 + Math.floor(Math.random() * 18);
        var lightness = 46 + Math.floor(Math.random() * 14);
        var answerHue = hues[0];
        var options = shuffle(hues.map(function (hue) {
          return { hue: hue, css: hslCss(hue, saturation, lightness) };
        }));
        var answerIndex = -1;
        for (var i = 0; i < options.length; i += 1) {
          if (options[i].hue === answerHue) {
            answerIndex = i;
            break;
          }
        }

        return {
          targetCss: hslCss(answerHue, saturation, lightness),
          options: options,
          answerIndex: answerIndex
        };
      }

      function renderRound() {
        state.locked = false;
        state.answerIndex = -1;

        var roundData = generateRound();
        state.answerIndex = roundData.answerIndex;

        els.target.style.backgroundColor = roundData.targetCss;
        els.roundText.textContent = 'Round ' + state.round + ' of ' + TOTAL_ROUNDS;
        els.scoreText.textContent = 'Score ' + state.score;

        var progress = Math.max(5, Math.round(((state.round - 1) / TOTAL_ROUNDS) * 100));
        els.progressBar.style.width = progress + '%';

        els.feedback.textContent = '';
        els.feedback.className = 'mt-5 min-h-6 text-center text-sm sm:text-base font-semibold';

        els.options.innerHTML = '';

        roundData.options.forEach(function (option, index) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'option-btn aspect-square w-full rounded-2xl border border-slate-900/10 shadow-md cursor-pointer';
          button.style.backgroundColor = option.css;
          button.setAttribute('aria-label', 'Colour option ' + (index + 1));
          button.addEventListener('click', function () {
            handleSelect(index);
          });
          els.options.appendChild(button);
        });
      }

      function markFeedback(type) {
        if (type === 'correct') {
          els.feedback.textContent = 'Correct! +1 point';
          els.feedback.className = 'mt-5 min-h-6 text-center text-sm sm:text-base font-semibold text-green-600';
        } else {
          els.feedback.textContent = 'Not quite - the highlighted colour was correct!';
          els.feedback.className = 'mt-5 min-h-6 text-center text-sm sm:text-base font-semibold text-red-500';
        }
      }

      function handleSelect(index) {
        if (state.locked) {
          return;
        }
        state.locked = true;

        var buttons = els.options.children;
        var answerButton = buttons[state.answerIndex];
        var clickedButton = buttons[index];
        var isCorrect = index === state.answerIndex;

        answerButton.classList.add('is-correct');

        if (isCorrect) {
          state.score += 1;
          els.scoreText.textContent = 'Score ' + state.score;
          markFeedback('correct');
        } else {
          clickedButton.classList.add('is-wrong');
          markFeedback('wrong');
        }

        for (var i = 0; i < buttons.length; i += 1) {
          if (i !== state.answerIndex) {
            buttons[i].classList.add('is-dimmed');
          }
        }

        window.setTimeout(function () {
          state.round += 1;
          if (state.round > TOTAL_ROUNDS) {
            showResult();
          } else {
            renderRound();
          }
        }, 1100);
      }

      function messageForScore(percentage) {
        if (percentage === 100) {
          return 'Perfect! Outstanding colour memory!';
        }
        if (percentage >= 80) {
          return 'Great job! Almost flawless.';
        }
        if (percentage >= 60) {
          return 'Good work! Keep training your eye.';
        }
        if (percentage >= 40) {
          return 'Nice try! A little more practice helps.';
        }
        return 'Good effort - play again to improve!';
      }

      function showResult() {
        var percentage = Math.round((state.score / TOTAL_ROUNDS) * 100);
        els.finalScore.textContent = state.score + ' / ' + TOTAL_ROUNDS;
        els.finalMessage.textContent = messageForScore(percentage);
        els.game.classList.add('hidden');
        els.result.classList.remove('hidden');
      }

      function restartGame() {
        state.round = 1;
        state.score = 0;
        state.locked = false;
        state.answerIndex = -1;
        els.result.classList.add('hidden');
        els.game.classList.remove('hidden');
        els.progressBar.style.width = '0%';
        renderRound();
      }

      els.playAgain.addEventListener('click', restartGame);

      renderRound();
    })();
  </script>
</body>
</html>
