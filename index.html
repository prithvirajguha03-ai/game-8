<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colour Match Game</title>
  <link href="./output.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 via-slate-100 to-cyan-100 p-4 font-sans text-slate-800 antialiased">

  <main id="difficulty" class="hidden w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-300/60 p-6 sm:p-10">
    <header class="text-center mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Choose Your Difficulty</h1>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">Pick how challenging you'd like today's round to be.</p>
    </header>

    <fieldset>
      <legend class="sr-only">Difficulty level</legend>
      <div class="space-y-3">
        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border-2 border-slate-200 bg-white p-4 sm:p-5 transition-all duration-150 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:ring-4 has-[:checked]:ring-indigo-100 has-[:focus-visible]:ring-4 has-[:focus-visible]:ring-indigo-300">
          <input class="peer sr-only" type="radio" name="difficulty" value="easy" aria-describedby="desc-easy">
          <span class="min-w-0 flex-1">
            <span class="block text-base sm:text-lg font-bold text-slate-900">Easy</span>
            <span id="desc-easy" class="mt-1 block text-sm sm:text-base text-slate-500">Relaxed pace with simpler colours.</span>
          </span>
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 text-base font-bold text-white transition-colors duration-150 peer-checked:border-indigo-600 peer-checked:bg-indigo-600" aria-hidden="true">✓</span>
        </label>

        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border-2 border-slate-200 bg-white p-4 sm:p-5 transition-all duration-150 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:ring-4 has-[:checked]:ring-indigo-100 has-[:focus-visible]:ring-4 has-[:focus-visible]:ring-indigo-300">
          <input class="peer sr-only" type="radio" name="difficulty" value="normal" aria-describedby="desc-normal">
          <span class="min-w-0 flex-1">
            <span class="block text-base sm:text-lg font-bold text-slate-900">Normal</span>
            <span id="desc-normal" class="mt-1 block text-sm sm:text-base text-slate-500">A balanced classic round.</span>
          </span>
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 text-base font-bold text-white transition-colors duration-150 peer-checked:border-indigo-600 peer-checked:bg-indigo-600" aria-hidden="true">✓</span>
        </label>

        <label class="flex cursor-pointer items-center gap-3 rounded-2xl border-2 border-slate-200 bg-white p-4 sm:p-5 transition-all duration-150 has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50 has-[:checked]:ring-4 has-[:checked]:ring-indigo-100 has-[:focus-visible]:ring-4 has-[:focus-visible]:ring-indigo-300">
          <input class="peer sr-only" type="radio" name="difficulty" value="hard" aria-describedby="desc-hard">
          <span class="min-w-0 flex-1">
            <span class="block text-base sm:text-lg font-bold text-slate-900">Hard</span>
            <span id="desc-hard" class="mt-1 block text-sm sm:text-base text-slate-500">Trickier colours and more rounds.</span>
          </span>
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 text-base font-bold text-white transition-colors duration-150 peer-checked:border-indigo-600 peer-checked:bg-indigo-600" aria-hidden="true">✓</span>
        </label>
      </div>
    </fieldset>

    <button id="start-game" type="button" disabled class="mt-8 w-full rounded-2xl bg-indigo-600 px-8 py-4 text-lg font-bold text-white shadow-md hover:bg-indigo-500 hover:shadow-lg active:scale-95 transition-all duration-150 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300 disabled:bg-slate-300 disabled:text-slate-500 disabled:shadow-none disabled:cursor-not-allowed disabled:active:scale-100 disabled:hover:bg-slate-300 disabled:hover:shadow-none">
      Start Game
    </button>
  </main>

  <main id="game" class="hidden w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-300/60 p-6 sm:p-10">
    <header class="text-center mb-6">
      <div class="flex items-center justify-center gap-3">
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Colour Match</h1>
        <span id="difficulty-badge" class="hidden rounded-full bg-indigo-100 px-3 py-1 text-xs sm:text-sm font-bold text-indigo-700"></span>
      </div>
      <p class="text-slate-500 mt-2 text-sm sm:text-base">Pick the colour that matches the target.</p>
    </header>

    <div class="flex items-center justify-between text-sm sm:text-base font-semibold text-slate-600">
      <span id="round-text">Round 1 of 10</span>
      <span id="score-text">Score 0</span>
    </div>

    <div class="mt-2 h-2 w-full bg-slate-100 rounded-full overflow-hidden" role="progressbar" aria-label="Round progress">
      <div id="progress-bar" class="h-full bg-indigo-500 rounded-full transition-all duration-300" style="width: 10%"></div>
    </div>

    <div class="mt-8">
      <p class="text-center text-xs uppercase tracking-widest text-slate-400 font-semibold mb-3">Match this colour</p>
      <div id="target" class="h-28 sm:h-36 w-full rounded-2xl border border-slate-900/10 shadow-inner transition-colors duration-300" aria-label="Target colour"></div>
    </div>

    <p id="feedback-text" class="mt-5 min-h-6 text-center text-sm sm:text-base font-semibold" aria-live="polite"></p>

    <div id="options" class="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4"></div>
  </main>

  <section id="result" class="hidden w-full max-w-xl bg-white rounded-3xl shadow-xl shadow-slate-300/60 p-6 sm:p-10 text-center">
    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900">Round Complete!</h2>
    <p class="mt-6 text-sm uppercase tracking-widest text-slate-400 font-semibold">Final Score</p>
    <p id="final-score" class="mt-2 text-5xl sm:text-6xl font-extrabold text-indigo-600">0 / 10</p>
    <p id="final-message" class="mt-4 text-slate-500 text-base sm:text-lg"></p>
    <div class="mt-8 flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-3">
      <button id="play-again" type="button" class="inline-block rounded-2xl bg-indigo-600 px-8 py-3 text-base font-bold text-white shadow-md hover:bg-indigo-500 hover:shadow-lg active:scale-95 transition-all duration-150 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300">
        Play Again
      </button>
      <button id="change-difficulty" type="button" class="inline-block rounded-2xl border-2 border-slate-200 bg-white px-8 py-3 text-base font-bold text-indigo-600 shadow-sm hover:bg-slate-50 active:scale-95 transition-all duration-150 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300">
        Change Difficulty
      </button>
    </div>
  </section>

  <script>
    (function () {
      'use strict';

      var DIFFICULTIES = {
        easy: {
          label: 'Easy',
          rounds: 8,
          options: 3,
          hueSteps: 6
        },
        normal: {
          label: 'Normal',
          rounds: 10,
          options: 4,
          hueSteps: 12
        },
        hard: {
          label: 'Hard',
          rounds: 12,
          options: 6,
          hueSteps: 18
        }
      };

      var DEFAULT_DIFFICULTY = 'normal';

      var OPTION_GRIDS = {
        3: 'grid-cols-3',
        4: 'grid-cols-2 md:grid-cols-4',
        6: 'grid-cols-2 md:grid-cols-3'
      };

      var session = {
        gameId: 'colour-match',
        difficulty: DEFAULT_DIFFICULTY,
        config: DIFFICULTIES[DEFAULT_DIFFICULTY]
      };

      var state = {
        round: 1,
        score: 0,
        locked: false,
        answerIndex: -1
      };

      var els = {
        difficulty: document.getElementById('difficulty'),
        game: document.getElementById('game'),
        result: document.getElementById('result'),
        target: document.getElementById('target'),
        options: document.getElementById('options'),
        feedback: document.getElementById('feedback-text'),
        roundText: document.getElementById('round-text'),
        scoreText: document.getElementById('score-text'),
        progressBar: document.getElementById('progress-bar'),
        finalScore: document.getElementById('final-score'),
        finalMessage: document.getElementById('final-message'),
        playAgain: document.getElementById('play-again'),
        changeDifficulty: document.getElementById('change-difficulty'),
        difficultyBadge: document.getElementById('difficulty-badge'),
        startGame: document.getElementById('start-game'),
        difficultyRadios: document.querySelectorAll('input[name="difficulty"]')
      };

      var SECTION_IDS = ['difficulty', 'game', 'result'];

      function showSection(id) {
        SECTION_IDS.forEach(function (sectionId) {
          document.getElementById(sectionId).classList.toggle('hidden', sectionId !== id);
        });
      }

      function validDifficulty(value) {
        return value && Object.prototype.hasOwnProperty.call(DIFFICULTIES, value);
      }

      function selectedDifficulty() {
        var checked = document.querySelector('input[name="difficulty"]:checked');
        return checked ? checked.value : null;
      }

      function updateStartState() {
        els.startGame.disabled = !selectedDifficulty();
      }

      function showDifficulty(preselect) {
        if (validDifficulty(preselect)) {
          var radio = document.querySelector('input[name="difficulty"][value="' + preselect + '"]');
          if (radio) {
            radio.checked = true;
          }
        }
        updateStartState();
        showSection('difficulty');
      }

      function shuffle(items) {
        var copy = items.slice();
        for (var i = copy.length - 1; i > 0; i -= 1) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        return copy;
      }

      function hslCss(hue, saturation, lightness) {
        return 'hsl(' + hue + ', ' + saturation + '%, ' + lightness + '%)';
      }

      function huePool(stepCount) {
        var pool = [];
        var step = 360 / stepCount;
        for (var i = 0; i < stepCount; i += 1) {
          pool.push(Math.round(step * i));
        }
        return pool;
      }

      function generateRound() {
        var hues = shuffle(huePool(session.config.hueSteps)).slice(0, session.config.options);
        var saturation = 58 + Math.floor(Math.random() * 18);
        var lightness = 46 + Math.floor(Math.random() * 14);
        var answerHue = hues[0];
        var options = shuffle(hues.map(function (hue) {
          return { hue: hue, css: hslCss(hue, saturation, lightness) };
        }));
        var answerIndex = -1;
        for (var i = 0; i < options.length; i += 1) {
          if (options[i].hue === answerHue) {
            answerIndex = i;
            break;
          }
        }

        return {
          targetCss: hslCss(answerHue, saturation, lightness),
          options: options,
          answerIndex: answerIndex
        };
      }

      function renderRound() {
        state.locked = false;
        state.answerIndex = -1;

        var roundData = generateRound();
        state.answerIndex = roundData.answerIndex;

        els.target.style.backgroundColor = roundData.targetCss;
        els.roundText.textContent = 'Round ' + state.round + ' of ' + session.config.rounds;
        els.scoreText.textContent = 'Score ' + state.score;

        var progress = Math.max(5, Math.round(((state.round - 1) / session.config.rounds) * 100));
        els.progressBar.style.width = progress + '%';

        els.feedback.textContent = '';
        els.feedback.className = 'mt-5 min-h-6 text-center text-sm sm:text-base font-semibold';

        els.options.className = 'mt-3 grid gap-3 sm:gap-4 ' + (OPTION_GRIDS[session.config.options] || OPTION_GRIDS[4]);

        els.options.innerHTML = '';

        roundData.options.forEach(function (option, index) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'option-btn aspect-square w-full rounded-2xl border border-slate-900/10 shadow-md cursor-pointer';
          button.style.backgroundColor = option.css;
          button.setAttribute('aria-label', 'Colour option ' + (index + 1));
          button.addEventListener('click', function () {
            handleSelect(index);
          });
          els.options.appendChild(button);
        });
      }

      function markFeedback(type) {
        if (type === 'correct') {
          els.feedback.textContent = 'Correct! +1 point';
          els.feedback.className = 'mt-5 min-h-6 text-center text-sm sm:text-base font-semibold text-green-600';
        } else {
          els.feedback.textContent = 'Not quite - the highlighted colour was correct!';
          els.feedback.className = 'mt-5 min-h-6 text-center text-sm sm:text-base font-semibold text-red-500';
        }
      }

      function handleSelect(index) {
        if (state.locked) {
          return;
        }
        state.locked = true;

        var buttons = els.options.children;
        var answerButton = buttons[state.answerIndex];
        var clickedButton = buttons[index];
        var isCorrect = index === state.answerIndex;

        answerButton.classList.add('is-correct');

        if (isCorrect) {
          state.score += 1;
          els.scoreText.textContent = 'Score ' + state.score;
          markFeedback('correct');
        } else {
          clickedButton.classList.add('is-wrong');
          markFeedback('wrong');
        }

        for (var i = 0; i < buttons.length; i += 1) {
          if (i !== state.answerIndex) {
            buttons[i].classList.add('is-dimmed');
          }
        }

        window.setTimeout(function () {
          state.round += 1;
          if (state.round > session.config.rounds) {
            showResult();
          } else {
            renderRound();
          }
        }, 1100);
      }

      function messageForScore(percentage) {
        if (percentage === 100) {
          return 'Perfect! Outstanding colour memory!';
        }
        if (percentage >= 80) {
          return 'Great job! Almost flawless.';
        }
        if (percentage >= 60) {
          return 'Good work! Keep training your eye.';
        }
        if (percentage >= 40) {
          return 'Nice try! A little more practice helps.';
        }
        return 'Good effort - play again to improve!';
      }

      function showResult() {
        var percentage = Math.round((state.score / session.config.rounds) * 100);
        els.finalScore.textContent = state.score + ' / ' + session.config.rounds;
        els.finalMessage.textContent = messageForScore(percentage);
        showSection('result');
      }

      function restartGame() {
        state.round = 1;
        state.score = 0;
        state.locked = false;
        state.answerIndex = -1;
        els.progressBar.style.width = '0%';
        showSection('game');
        renderRound();
      }

      function startGame() {
        var difficulty = validDifficulty(selectedDifficulty()) ? selectedDifficulty() : DEFAULT_DIFFICULTY;
        session.difficulty = difficulty;
        session.config = DIFFICULTIES[difficulty];
        els.difficultyBadge.textContent = DIFFICULTIES[difficulty].label;
        els.difficultyBadge.classList.remove('hidden');
        restartGame();
      }

      els.difficultyRadios.forEach(function (radio) {
        radio.addEventListener('change', updateStartState);
      });

      els.startGame.addEventListener('click', startGame);
      els.playAgain.addEventListener('click', restartGame);

      els.changeDifficulty.addEventListener('click', function () {
        showDifficulty(session.difficulty);
      });

      updateStartState();
      showSection('difficulty');
    })();
  </script>
</body>
</html>
